# Runs the whole cinema on one server, with HTTPS. See the README for setup.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "true"
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://live.${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Video and sound go straight to browsers, not through the HTTPS proxy.
      - "7881:7881/tcp"
      - "7882:7882/udp"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
